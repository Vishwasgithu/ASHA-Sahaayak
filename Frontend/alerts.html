<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Active Alerts & Referrals | ASHA-Sahaayak</title>
  <meta name="description" content="Manage critical maternal alerts, warning statuses, and generate primary health center referrals." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* Specific styles for referral slips and alerts */
    .alerts-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 16px;
    }

    .alert-card-actionable {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px;
      background-color: white;
      border: var(--border-light);
      border-left-width: 4px;
      border-radius: var(--radius-lg);
      transition: all var(--transition-fast);
      gap: 20px;
    }

    .alert-card-actionable:hover {
      box-shadow: var(--shadow-sm);
      transform: translateX(4px);
    }

    .alert-card-actionable--critical {
      border-left-color: var(--danger-500);
    }
    .alert-card-actionable--warning {
      border-left-color: var(--warning-500);
    }

    .alert-card-content {
      display: flex;
      gap: 16px;
      flex: 1;
    }

    .alert-body-text {
      display: flex;
      flex-direction: column;
    }

    .alert-body-title {
      font-weight: 750;
      font-size: 1.05rem;
      color: var(--neutral-900);
    }

    .alert-body-desc {
      font-size: 0.88rem;
      color: var(--neutral-600);
      margin-top: 4px;
      line-height: 1.5;
    }

    .alert-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .alert-tag-time {
      font-size: 0.75rem;
      color: var(--neutral-400);
      font-weight: 550;
    }

    /* Modal for referral form */
    .referral-form-box {
      border: 2px dashed var(--neutral-300);
      padding: 24px;
      background-color: var(--neutral-50);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      color: var(--neutral-800);
    }

    .referral-field {
      border-bottom: 1px solid var(--neutral-200);
      padding: 8px 0;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .referral-field strong {
      color: var(--neutral-900);
    }

    /* Modal dialog overrides */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background-color: white;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      box-shadow: var(--shadow-lg);
      border: var(--border-light);
      animation: modalSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 24px 30px;
      border-bottom: var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--neutral-400);
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
    }

    .modal-body {
      padding: 30px;
      overflow-y: auto;
      max-height: 70vh;
    }

    @media print {
      .modal-close, .modal-body button, .btn {
        display: none !important;
      }
      .modal {
        position: relative !important;
        background: none !important;
        padding: 0 !important;
      }
      .modal-content {
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>

        <a href="index.html" class="logout-btn" title="Logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></a>
      </div>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-header">
      <div class="header-left">
        <button class="hamburger" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div>
          <h1 class="page-title">Maternal Alerts</h1>
          <p class="page-subtitle">Critical screening flags requiring attention or referrals</p>
        </div>
      </div>
    </header>

    <div class="content-area">
      <div class="alerts-container" id="alertsContainer">
        <!-- Dynamically generated list items -->
      </div>
    </div>
  </main>

  <!-- Referral slip modal -->
  <div class="modal" id="referralModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="card-title">🚨 PHC Official Referral Form</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="referral-form-box" id="referralBox">
          <!-- Dynamically populated referral -->
        </div>
        <div style="display:flex; gap:16px; margin-top:24px;">
          <button class="btn btn-secondary" onclick="closeModal()" style="flex:1;">Cancel</button>
          <button class="btn btn-primary" onclick="window.print()" style="flex:1.2;">🖨️ Print Referral Slip</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let patients = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadAlerts();
    });

    function loadAlerts() {
      patients = window.getPatients();
      
      // Filter out high-risk or emergency cases
      const alertPatients = patients.filter(p => p.risk === 'HIGH' || p.risk === 'EMERGENCY');
      
      // Update sidebar alert badge counts
      const alertCount = alertPatients.length;
      document.getElementById('alertCountBadge').textContent = alertCount;

      const container = document.getElementById('alertsContainer');
      container.innerHTML = '';

      if (alertCount === 0) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding: 40px;">
            <span style="font-size:2rem;">✓</span>
            <h2 style="margin-top:12px;">No Active Danger Signals</h2>
            <p style="color:var(--neutral-400); margin-top:4px;">All registered patients display normal progress indices.</p>
          </div>
        `;
        return;
      }

      alertPatients.forEach(p => {
        const item = document.createElement('div');
        
        const isCritical = p.risk === 'EMERGENCY';
        const cardClass = isCritical ? 'alert-card-actionable alert-card-actionable--critical' : 'alert-card-actionable alert-card-actionable--warning';
        const riskClass = isCritical ? 'risk-badge risk-badge--emergency' : 'risk-badge risk-badge--high';
        const icon = isCritical ? '🚨' : '⚠️';
        
        item.className = cardClass;
        item.innerHTML = `
          <div class="alert-card-content">
            <div class="alert-icon" style="font-size: 1.4rem;">${icon}</div>
            <div class="alert-body-text">
              <span class="alert-body-title">${p.name} (Month ${p.month})</span>
              <span class="alert-body-desc">${p.notes ? p.notes.split('\n')[0] : 'Elevated gestational warning flags detected.'}</span>
              <div class="alert-badge-row">
                <span class="${riskClass}">${p.risk}</span>
                <span class="alert-tag-time">Village: ${p.village} · Last Checkup: ${p.date || 'N/A'}</span>
              </div>
            </div>
          </div>
          <div>
            <button class="btn btn-primary" onclick="openReferral('${p.id}')">Refer to PHC</button>
          </div>
        `;
        
        container.appendChild(item);
      });
    }

    function openReferral(id) {
      const p = patients.find(patient => patient.id === id);
      if (!p) return;

      const modal = document.getElementById('referralModal');
      const box = document.getElementById('referralBox');

      box.innerHTML = `
        <div style="text-align:center; border-bottom:2px solid var(--neutral-800); padding-bottom:12px; margin-bottom:16px;">
          <h3 style="font-family:var(--font-headers); font-size:1.15rem; font-weight:800; color:var(--neutral-900); text-transform:uppercase;">Primary Health Center Referral Slip</h3>
          <span style="font-size:0.75rem; color:var(--neutral-400); font-weight:600; letter-spacing:0.02em;">ASHA-SAHAAYAK HEALTHCARE AI SUPPORT SYSTEM</span>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px;">
          <div class="referral-field"><span>Referral Date:</span><strong>${new Date().toLocaleDateString('en-IN')}</strong></div>
          <div class="referral-field"><span>Patient Name:</span><strong>${p.name}</strong></div>
          <div class="referral-field"><span>Age / Blood Group:</span><strong>${p.age} Yrs / ${p.bloodGroup || 'N/A'}</strong></div>
          <div class="referral-field"><span>Pregnancy Month:</span><strong>Month ${p.month} (Trimester ${Math.ceil(p.month/3)})</strong></div>
          <div class="referral-field"><span>Village / Contact:</span><strong>${p.village} / ${p.contact}</strong></div>
          <div class="referral-field"><span>Clinical Severity:</span><strong style="color:var(--danger-600)">${p.risk} STATUS</strong></div>
        </div>

        <div style="margin-top:16px;">
          <div style="font-size:0.75rem; font-weight:750; color:var(--neutral-400); text-transform:uppercase; letter-spacing:0.02em; margin-bottom:4px;">Diagnostic Notes & Symptoms</div>
          <div style="font-size:0.85rem; background:white; padding:12px; border:var(--border-light); border-radius:6px; font-style:italic; line-height:1.4;">${p.notes || 'Patient exhibits persistent warning signs.'}</div>
        </div>

        <div style="margin-top:24px; border-top:1px solid var(--neutral-300); padding-top:16px; display:flex; justify-content:space-between; align-items:flex-end;">
          <div>
            <div style="font-size:0.75rem; color:var(--neutral-400); font-weight:650;">Referred By:</div>
            <div style="font-size:0.88rem; font-weight:700; color:var(--neutral-800);">Priya Sharma, ASHA Worker</div>
          </div>
          <div style="border-top:1px solid var(--neutral-400); width:120px; text-align:center; padding-top:4px; font-size:0.7rem; color:var(--neutral-400); font-weight:600;">Authorized Signature</div>
        </div>
      `;

      modal.classList.add('open');
    }

    function closeModal() {
      document.getElementById('referralModal').classList.remove('open');
    }
  </script>
</body>
